# Production-like stack. Configuration comes from .env (copy .env.example); see README.
services:
  db:
    image: postgres:16
    container_name: mahbase-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks:
      - mahbase

  # Celery broker for the reservation-expiry schedule and asynchronous gateway refunds.
  redis:
    image: redis:7-alpine
    container_name: mahbase-redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - mahbase

  backend:
    build: ./backend
    container_name: mahbase-backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_MEDIA_ROOT: /srv/media
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      PAYMENT_MOCK_API_URL: http://payment-mock:8090
    volumes:
      - media-data:/srv/media
      - static-data:/app/staticfiles
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      payment-mock:
        condition: service_started
    networks:
      - mahbase

  # Worker and beat expose no endpoint, so they have no host port mapping.
  worker:
    build: ./backend
    container_name: mahbase-worker
    command: celery -A config worker --loglevel=INFO
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      PAYMENT_MOCK_API_URL: http://payment-mock:8090
    depends_on:
      - backend
      - redis
    networks:
      - mahbase

  beat:
    build: ./backend
    container_name: mahbase-beat
    command: celery -A config beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - mahbase

  # Entry point (nginx/nginx.conf): :80 Django API/Admin + static/media, :8081 storefront, :3000 admin panel.
  proxy:
    image: nginx:1.27-alpine
    container_name: mahbase-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media-data:/srv/media:ro
      - static-data:/srv/static:ro
    ports:
      - "${PROXY_HOST_PORT:-8080}:80"
      - "${STOREFRONT_HOST_PORT:-8081}:8081"
      - "${ADMIN_PANEL_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
      - frontend
      - admin-panel
    networks:
      - mahbase

  admin-panel:
    build: ./admin-panel
    container_name: mahbase-admin-panel
    environment:
      BACKEND_URL: http://proxy
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JWT_ACCESS_COOKIE_SECONDS: ${JWT_ACCESS_COOKIE_SECONDS:-240}
      JWT_REFRESH_COOKIE_SECONDS: ${JWT_REFRESH_COOKIE_SECONDS:-86400}
    # Served to browsers through proxy:3000; the direct port is for debugging the Next.js server alone.
    ports:
      - "${ADMIN_PANEL_DIRECT_HOST_PORT:-3001}:3000"
    networks:
      - mahbase

  # Customer storefront (Next.js): server-renders the pages for search engines and forwards /api/ and /media/ to
  # the backend proxy, so the storefront and the API share one origin (guest cart session cookie, bank return URL).
  frontend:
    build: ./frontend
    container_name: mahbase-frontend
    environment:
      BACKEND_URL: http://proxy
      STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:8081}
    # Served to browsers through proxy:8081; the direct port is for debugging the Next.js server alone.
    ports:
      - "${STOREFRONT_DIRECT_HOST_PORT:-3002}:3000"
    networks:
      - mahbase

  # Mock Iranian bank gateway (development/test only): the backend calls it, customers open its pay page.
  payment-mock:
    build: ./payment-mock
    container_name: mahbase-payment-mock
    environment:
      MOCK_BANK_MERCHANT_ID: ${PAYMENT_MERCHANT_ID:-mahbase-test-merchant}
    ports:
      - "${PAYMENT_MOCK_HOST_PORT:-8090}:8090"
    networks:
      - mahbase

networks:
  mahbase:
    name: mahbase

volumes:
  postgres-data:
  media-data:
  static-data:
