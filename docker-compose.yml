# Production-like stack. Configuration comes from .env (copy .env.example); see README.
services:
  db:
    image: postgres:16
    container_name: mahbase-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks:
      - mahbase

  # Celery broker for the reservation-expiry schedule and asynchronous gateway refunds.
  redis:
    image: redis:7-alpine
    container_name: mahbase-redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - mahbase

  backend:
    build: ./backend
    container_name: mahbase-backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_MEDIA_ROOT: /srv/media
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    volumes:
      - media-data:/srv/media
      - static-data:/app/staticfiles
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mahbase

  # Worker and beat expose no endpoint, so they have no host port mapping.
  worker:
    build: ./backend
    container_name: mahbase-worker
    command: celery -A config worker --loglevel=INFO
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    networks:
      - mahbase

  beat:
    build: ./backend
    container_name: mahbase-beat
    command: celery -A config beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - mahbase

  # Serves Django static/media files and proxies API and admin requests to gunicorn.
  proxy:
    image: nginx:1.27-alpine
    container_name: mahbase-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media-data:/srv/media:ro
      - static-data:/srv/static:ro
    ports:
      - "${PROXY_HOST_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - mahbase

  frontend:
    build: ./frontend
    container_name: mahbase-frontend
    environment:
      BACKEND_URL: http://proxy
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JWT_ACCESS_COOKIE_SECONDS: ${JWT_ACCESS_COOKIE_SECONDS:-240}
      JWT_REFRESH_COOKIE_SECONDS: ${JWT_REFRESH_COOKIE_SECONDS:-86400}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - proxy
    networks:
      - mahbase

networks:
  mahbase:
    name: mahbase

volumes:
  postgres-data:
  media-data:
  static-data:
