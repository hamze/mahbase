# Keep the scheme set by an outer proxy (Traefik terminating TLS on the server); fall back to nginx's own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Django: API, Django Admin, static/media. The Next.js apps reach the backend through this server (http://proxy).
server {
    listen 80 default_server;
    client_max_body_size 10m;

    location /static/ {
        alias /srv/static/;
    }

    location /media/ {
        alias /srv/media/;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# Customer storefront. Both Next.js apps use /_next/ and /api/, so each gets its own server (port) instead of a path.
server {
    listen 8081;
    client_max_body_size 10m;

    location /media/ {
        alias /srv/media/;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# Admin panel (/manage).
server {
    listen 3000;
    client_max_body_size 10m;

    location /media/ {
        alias /srv/media/;
    }

    location / {
        proxy_pass http://admin-panel:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
